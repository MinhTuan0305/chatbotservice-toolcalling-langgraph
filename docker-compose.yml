# Shop Chatbot stack: Nginx (single public entrypoint) -> socket_server
# (real-time gateway) -> api_server (AI Agent, internal only) -> redis
# (LangGraph checkpointer).
#
# Secrets/config come from .env (GEMINI_API_KEY, DATABASE_URL, API_KEY,
# JWT_SECRET_KEY, Langfuse keys, ...). REDIS_URL, AI_SERVICE_URL and
# LANGFUSE_HOST are overridden below to values that resolve from inside a
# container — the values in .env meant for running the services directly on
# your host (redis://localhost, http://127.0.0.1:8000, http://localhost:3000)
# don't resolve inside containers.

services:
  redis:
    # langgraph-checkpoint-redis needs the RediSearch module (FT.* commands)
    # to index checkpoints — plain redis:7-alpine doesn't have it.
    image: redis/redis-stack-server:7.4.0-v3
    restart: unless-stopped
    volumes:
      - shop_redis_data:/data
    networks:
      - shop-network

  api_server:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.api_server
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379/0
      # Langfuse (docker-compose.langfuse.yml) publishes its web UI/API on
      # the HOST at port 3000 — reach it via the host gateway rather than
      # the langfuse-network (a separate Compose project's network), since
      # only the port is guaranteed, not the network name.
      LANGFUSE_HOST: http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    volumes:
      - shop_logs:/app/logs
    networks:
      - shop-network
    restart: unless-stopped

  socket_server:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.socket_server
    env_file: .env
    environment:
      SOCKET_HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://api_server:8000
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      - api_server
    volumes:
      - shop_logs:/app/logs
    networks:
      - shop-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - socket_server
    networks:
      - shop-network
    restart: unless-stopped

networks:
  shop-network:
    driver: bridge

volumes:
  shop_redis_data:
  shop_logs:
