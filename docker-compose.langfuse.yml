# Langfuse v4 Self-Hosted Stack
# Chạy: docker compose -f docker-compose.langfuse.yml up -d
#
# ⚠️  QUAN TRỌNG:
#   - Copy file .env.langfuse.example thành .env.langfuse và điền giá trị thật
#   - Redis này (port 6380) ĐỘC LẬP với Redis LangGraph (port 6379)
#   - Postgres này (port 5433) ĐỘC LẬP với Postgres của devdb (port 2703)
#
# Sau khi chạy xong:
#   1. Truy cập http://localhost:3000
#   2. Đăng ký tài khoản (email = LANGFUSE_INIT_USER_EMAIL)
#   3. Tạo project → vào Settings → lấy Public Key + Secret Key
#   4. Điền vào .env: LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY

services:

  # ─────────────────────────────────────────────
  # Langfuse Web — UI + REST API
  # ─────────────────────────────────────────────
  langfuse-web:
    image: docker.io/langfuse/langfuse:4
    restart: always
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env.langfuse
    environment:
      # Override S3 media endpoint to localhost for browser access
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
    networks:
      - langfuse-network

  # ─────────────────────────────────────────────
  # Langfuse Worker — async ingestion processor
  # ─────────────────────────────────────────────
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4
    restart: always
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:3030:3030"
    env_file:
      - .env.langfuse
    networks:
      - langfuse-network

  # ─────────────────────────────────────────────
  # ClickHouse — OLAP engine cho traces/observations
  # ─────────────────────────────────────────────
  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse_secret   # đổi nếu muốn
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9001:9000"   # 9001 → tránh conflict nếu có ClickHouse khác
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - langfuse-network

  # ─────────────────────────────────────────────
  # MinIO — S3-compatible blob storage cho raw events
  # ─────────────────────────────────────────────
  langfuse-minio:
    image: cgr.dev/chainguard/minio
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret          # đổi nếu muốn
    ports:
      - "9090:9000"           # S3 API (dùng trong app config)
      - "127.0.0.1:9091:9001" # MinIO Console UI
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - langfuse-network

  # ─────────────────────────────────────────────
  # Redis — queue & cache cho Langfuse (port 6380)
  # KHÁC với Redis LangGraph checkpointer (port 6379)
  # ─────────────────────────────────────────────
  langfuse-redis:
    image: docker.io/redis:7
    restart: always
    command: >
      --requirepass langfuse_redis_secret
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6380:6379"   # expose ra port 6380 để không conflict
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "langfuse_redis_secret", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    networks:
      - langfuse-network

  # ─────────────────────────────────────────────
  # Postgres — transactional DB cho Langfuse (port 5433)
  # KHÁC với Postgres devdb (port 2703, host 10.0.0.114)
  # ─────────────────────────────────────────────
  langfuse-postgres:
    image: docker.io/postgres:17
    restart: always
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_pg_secret    # đổi nếu muốn
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5434:5432"   # expose ra port 5433 để không conflict
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - langfuse-network

networks:
  langfuse-network:
    driver: bridge

volumes:
  langfuse_postgres_data:
    driver: local
  langfuse_clickhouse_data:
    driver: local
  langfuse_clickhouse_logs:
    driver: local
  langfuse_minio_data:
    driver: local
  langfuse_redis_data:
    driver: local
