<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Chatbot - Test Client</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px;
        }
        
        .header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 16px 16px 0 0;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        
        .status-dot.disconnected {
            background: #ef4444;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .settings {
            padding: 16px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        
        .settings input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .settings label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .settings button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .settings button:hover {
            background: #5568d3;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
        }
        
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .message.user .message-avatar {
            background: #667eea;
        }
        
        .message.bot .message-avatar {
            background: #10b981;
        }
        
        .message-content {
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 16px;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: #667eea;
            color: white;
        }
        
        .message.bot .message-content {
            background: #f1f5f9;
            color: #1e293b;
        }
        
        .tool-calls {
            margin-top: 8px;
            padding: 8px;
            background: #e0e7ff;
            border-radius: 8px;
            font-size: 12px;
        }
        
        .tool-call {
            margin: 4px 0;
            color: #4338ca;
        }
        
        .input-container {
            padding: 20px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
        }
        
        .input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
        }
        
        .input-container button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: #667eea;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .input-container button:hover {
            background: #5568d3;
        }
        
        .input-container button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        
        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
            animation: typing 1.4s infinite;
        }
        
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛍️ Shop Customer Service Chatbot</h1>
            <div class="status">
                <div class="status-dot disconnected" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
        
        <div class="settings" id="loginSettings">
            <input type="text" id="gatewayUrlInput" placeholder="Gateway URL" value="http://localhost:5000">
            <input type="text" id="userIdInput" placeholder="User ID (e.g. alice)" value="demo-user">
            <button id="loginBtn">Login</button>
        </div>

        <div class="settings" id="chatSettings" style="display: none;">
            <input type="text" id="threadId" disabled>
            <button id="joinBtn">Join Thread</button>
            <label>
                <input type="checkbox" id="toolEnabled" checked>
                <span>Tools Enabled</span>
            </label>
            <label>
                <input type="checkbox" id="streamEnabled" checked>
                <span>Streaming</span>
            </label>
        </div>

        <div class="chat-container" id="chatContainer"></div>

        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." disabled>
            <button id="sendBtn" disabled>Send</button>
        </div>
    </div>

    <script>
        // Base URL of the Socket gateway (also used for the /auth/token demo issuer).
        // Set from the "Gateway URL" field at login — e.g. http://localhost:5000
        // running socket_server directly, or http://localhost (port 80) through
        // the Nginx entrypoint from docker-compose.yml.
        let GATEWAY_URL = 'http://localhost:5000';

        // Socket.IO connection — created only after we have a JWT (see login())
        let socket = null;

        // DOM elements
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const loginSettings = document.getElementById('loginSettings');
        const chatSettings = document.getElementById('chatSettings');
        const gatewayUrlInput = document.getElementById('gatewayUrlInput');
        const userIdInput = document.getElementById('userIdInput');
        const loginBtn = document.getElementById('loginBtn');
        const threadIdInput = document.getElementById('threadId');
        const joinBtn = document.getElementById('joinBtn');
        const toolEnabledCheckbox = document.getElementById('toolEnabled');
        const streamEnabledCheckbox = document.getElementById('streamEnabled');
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // State
        let currentThreadId = null;
        let isJoined = false;
        let currentBotMessage = null;

        // ─────────────────────────────────────────────
        // Login (demo token issuer) + Socket connection
        // ─────────────────────────────────────────────

        async function login() {
            const gatewayUrl = gatewayUrlInput.value.trim().replace(/\/$/, '');
            const userId = userIdInput.value.trim();

            if (!gatewayUrl) {
                alert('Please enter the gateway URL');
                return;
            }
            if (!userId) {
                alert('Please enter a user ID');
                return;
            }

            GATEWAY_URL = gatewayUrl;
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const resp = await fetch(`${GATEWAY_URL}/auth/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await resp.json();

                if (!resp.ok) {
                    throw new Error(data.error || `HTTP ${resp.status}`);
                }

                // Each user owns exactly one thread: their own user_id
                threadIdInput.value = data.user_id;
                connectSocket(data.token);

                loginSettings.style.display = 'none';
                chatSettings.style.display = 'flex';
            } catch (err) {
                console.error('Login failed:', err);
                alert(`Login failed: ${err.message}`);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }

        function connectSocket(token) {
            socket = io(GATEWAY_URL, { auth: { token } });

            socket.on('connect', () => {
                console.log('Connected to server');
                statusDot.classList.remove('disconnected');
                statusText.textContent = 'Connected';
            });

            socket.on('connect_error', (err) => {
                console.error('Connection rejected:', err.message);
                addSystemMessage(`Connection rejected: ${err.message}`, 'error');
                statusDot.classList.add('disconnected');
                statusText.textContent = 'Rejected';
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from server');
                statusDot.classList.add('disconnected');
                statusText.textContent = 'Disconnected';
                isJoined = false;
                messageInput.disabled = true;
                sendBtn.disabled = true;
            });

            socket.on('connected', (data) => {
                console.log('Server connected:', data);
                addSystemMessage(`Connected to server as ${data.user_id}`);
            });

            socket.on('thread_joined', (data) => {
                console.log('Joined thread:', data);
                currentThreadId = data.thread_id;
                isJoined = true;
                messageInput.disabled = false;
                sendBtn.disabled = false;
                joinBtn.textContent = 'Leave Thread';
                addSystemMessage(`Joined thread: ${data.thread_id}`);

                // Update tool checkbox
                toolEnabledCheckbox.checked = data.tool_enabled;
            });

            socket.on('thread_left', (data) => {
                console.log('Left thread:', data);
                currentThreadId = null;
                isJoined = false;
                messageInput.disabled = true;
                sendBtn.disabled = true;
                joinBtn.textContent = 'Join Thread';
                addSystemMessage(`Left thread: ${data.thread_id}`);
            });

            socket.on('bot_response', (data) => {
                console.log('Bot response:', data);
                addBotMessage(data.final_answer, data.tool_calls);
            });

            socket.on('bot_chunk', (event) => {
                if (event.type === 'chunk') {
                    if (!currentBotMessage) {
                        currentBotMessage = addBotMessage('', []);
                    }
                    appendToBotMessage(currentBotMessage, event.data);
                } else if (event.type === 'done') {
                    if (currentBotMessage && event.tool_calls && event.tool_calls.length > 0) {
                        addToolCallsToMessage(currentBotMessage, event.tool_calls);
                    }
                    currentBotMessage = null;
                } else if (event.type === 'error') {
                    addSystemMessage(`Error: ${event.error}`, 'error');
                    currentBotMessage = null;
                }
            });

            socket.on('tools_toggled', (data) => {
                console.log('Tools toggled:', data);
                addSystemMessage(`Tools ${data.tool_enabled ? 'enabled' : 'disabled'}`);
            });

            socket.on('error', (data) => {
                console.error('Server error:', data);
                addSystemMessage(`Error: ${data.error}`, 'error');
            });
        }

        loginBtn.addEventListener('click', login);
        userIdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });

        // ─────────────────────────────────────────────
        // UI Functions
        // ─────────────────────────────────────────────
        
        function addUserMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `
                <div class="message-avatar">👤</div>
                <div class="message-content">${escapeHtml(text)}</div>
            `;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }
        
        function addBotMessage(text, toolCalls = []) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            
            let toolCallsHtml = '';
            if (toolCalls && toolCalls.length > 0) {
                toolCallsHtml = '<div class="tool-calls">' +
                    toolCalls.map(tc => 
                        `<div class="tool-call">🔧 ${tc.tool_name}(${JSON.stringify(tc.arguments)})</div>`
                    ).join('') +
                    '</div>';
            }
            
            messageDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <span class="bot-text">${escapeHtml(text)}</span>
                    ${toolCallsHtml}
                </div>
            `;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv;
        }
        
        function appendToBotMessage(messageDiv, text) {
            const botText = messageDiv.querySelector('.bot-text');
            botText.textContent += text;
            scrollToBottom();
        }
        
        function addToolCallsToMessage(messageDiv, toolCalls) {
            const messageContent = messageDiv.querySelector('.message-content');
            const toolCallsHtml = '<div class="tool-calls">' +
                toolCalls.map(tc => 
                    `<div class="tool-call">🔧 ${tc.tool_name}(${JSON.stringify(tc.arguments)})</div>`
                ).join('') +
                '</div>';
            messageContent.innerHTML += toolCallsHtml;
        }
        
        function addSystemMessage(text, type = 'info') {
            const messageDiv = document.createElement('div');
            messageDiv.style.textAlign = 'center';
            messageDiv.style.fontSize = '12px';
            messageDiv.style.color = type === 'error' ? '#ef4444' : '#64748b';
            messageDiv.style.padding = '8px';
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }
        
        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ─────────────────────────────────────────────
        // Event Handlers
        // ─────────────────────────────────────────────
        
        joinBtn.addEventListener('click', () => {
            const threadId = threadIdInput.value.trim();
            
            if (!threadId) {
                alert('Please enter a thread ID');
                return;
            }
            
            if (!isJoined) {
                socket.emit('join_thread', { thread_id: threadId });
            } else {
                socket.emit('leave_thread', { thread_id: currentThreadId });
            }
        });
        
        toolEnabledCheckbox.addEventListener('change', (e) => {
            if (isJoined) {
                socket.emit('toggle_tools', {
                    thread_id: currentThreadId,
                    enabled: e.target.checked
                });
            }
        });
        
        function sendMessage() {
            const message = messageInput.value.trim();
            
            if (!message || !isJoined) return;
            
            addUserMessage(message);
            messageInput.value = '';
            
            const data = {
                message: message,
                thread_id: currentThreadId,
                tool_enabled: toolEnabledCheckbox.checked
            };
            
            if (streamEnabledCheckbox.checked) {
                socket.emit('chat_stream', data);
            } else {
                socket.emit('chat_message', data);
            }
        }
        
        sendBtn.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
