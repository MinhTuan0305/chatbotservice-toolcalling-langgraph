# Single public entrypoint in front of the Socket gateway (socket_server.py).
# api_server.py (the AI Agent service) is intentionally NOT routed here —
# it is only ever called internally, by socket_server over the compose network.

upstream socket_server {
    server socket_server:5000;
}

server {
    listen 80;

    # Socket.IO handshake + WebSocket upgrade. proxy_http_version 1.1 and the
    # Upgrade/Connection headers are required — without them Nginx won't
    # upgrade the connection and Socket.IO silently falls back to polling
    # (or fails outright).
    location /socket.io/ {
        proxy_pass http://socket_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Demo JWT issuer (see POST /auth/token in socket_server.py)
    location /auth/ {
        proxy_pass http://socket_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin/monitoring endpoints (protected by API_KEY in socket_server.py)
    location ~ ^/(health|stats|metrics)$ {
        proxy_pass http://socket_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
